worker_processes auto;

# Khi reload (chuyen blue <-> green), worker cu KHONG cat ket noi WebSocket dang mo;
# no giu ket noi toi khi client tu chuyen sang (finalize.sh gui tin hieu reconnect).
# 20 phut > cua so quan sat 15 phut + 45 giay drain.
worker_shutdown_timeout 20m;

events {
  worker_connections 10240;
}

http {
  # Chi chua 1 dong "upstream shopfast_api { server api-<mau>:3000; }",
  # deploy.sh / rollback.sh ghi lai file nay roi "nginx -s reload"
  include /etc/nginx/upstream/active.conf;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    location /ws {
      proxy_pass http://shopfast_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://shopfast_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Container dang drain tra 503 -> nginx thu container khac, nguoi dung khong thay loi
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
    }
  }
}

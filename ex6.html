<body>
    <h1>Thao tác với mảng splive()</h1>
    <p>Mảng hiện tại: ["Red", "Green", "Blue"]</p>
    <button onclick="manipulateArray()">Thao tác mảng</button>
</body>
<script>
    let colors = ["Red", "Green", "Blue"];

    function manipulateArray() {
        colors.splice(1, 0, "Yellow", "Pink"); 
        console.log("Mảng sau khi thêm: " + colors);
        alert("Mảng sau khi thêm: " + colors);
    }
</script>

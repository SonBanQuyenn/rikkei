<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-lg shadow-md w-full max-w-md p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Tìm Kiếm Chuyến Đi</h2>

        <form>
            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">Điểm đến</label>
                <input type="text" placeholder="Bạn muốn đi đâu?"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Ngày đi</label>
                <input type="date" placeholder="dd/mm/yyyy"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>

            <button type="submit"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                Tìm kiếm
            </button>
        </form>
    </div>

</body>

</html>

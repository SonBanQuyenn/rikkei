<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 6</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        ul {
            margin-top: 20px;
            padding-left: 30px;
        }

        li {
            margin: 5px 0;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Thêm và Xóa phần tử động</h1>

    <button id="add-btn">Add Item</button>
    <button id="remove-btn">Remove Last</button>

    <ul id="item-list"></ul>

    <script>
        let addBtn = document.getElementById("add-btn");
        let removeBtn = document.getElementById("remove-btn");
        let itemList = document.getElementById("item-list");

        addBtn.addEventListener("click", function () {
            let newItem = document.createElement("li");
            newItem.textContent = "New Item";
            itemList.appendChild(newItem);
            console.log("Đã thêm New Item vào danh sách");
        });

        removeBtn.addEventListener("click", function () {
            let lastItem = itemList.lastElementChild;
            if (lastItem) {
                itemList.removeChild(lastItem);
                console.log("Đã xóa phần tử cuối cùng");
            } else {
                console.log("Danh sách đã rỗng, không thể xóa");
            }
        });
    </script>
</body>

</html>

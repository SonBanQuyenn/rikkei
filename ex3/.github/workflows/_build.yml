# Workflow dung chung: build image va day len kho voi the = ma commit
name: _build

on:
  workflow_call:
    outputs:
      image_tag:
        description: Ma commit dung lam the image
        value: ${{ jobs.build.outputs.image_tag }}

env:
  IMAGE: ghcr.io/shopfast/api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          # The theo ma commit la bat bien -> quay lui duoc ve bat ky phien ban nao
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

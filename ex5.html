<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 5</title>
</head>

<body>
    <input type="text" id="user-input" placeholder="Nhập nội dung tại đây...">

    <p id="key-display"></p>

    <script>
        let inputElement = document.getElementById("user-input");
        let keyDisplay = document.getElementById("key-display");

        inputElement.addEventListener("keydown", function (event) {
            keyDisplay.textContent = "Bạn vừa nhấn phím: " + event.key;
            console.log("Phím vừa nhấn:", event.key);
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 7</title>
</head>
<body>
    <h1>Duyệt mảng với forEach và Map</h1>
    <p>Mảng hiện tại: [1, 2, 3, 4, 5]</p>
    <button onclick="iterateArray()">Duyệt mảng</button>
</body>
<script>
    let numbers = [1, 2, 3, 4, 5];

    function iterateArray() {
        numbers.forEach(function(number, index) {
            console.log("Số " + (index + 1) + " có bình phương là: " + (number * number));
            alert("Số " + (index + 1) + " có bình phương là: " + (number * number));
        });
        const doubledNumbers = numbers.map(function(number) {
            return number * 2;
        });
        alert("Mảng sau khi nhân đôi: " + doubledNumbers);
    }
</script>
</html>

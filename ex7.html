<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 7</title>
</head>
<body>
    <script>
        function simulateTask() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve("Task completed!");
                    }, 2000);
                });
            }

        function runTask() {
            console.log("Starting task...");
            simulateTask()
                .then(result => {
                    console.log(result);
                })
                .catch(error => {
                    console.error("Task failed:", error);
                });
        }

            runTask();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 8</title>
</head>
<body>
    <h1>Lọc dữ liệu với Filter</h1>
    <p>Mảng hiện tại: [15, 20, 12, 18, 25, 30, 10]</p>
    <button onclick="filterArray()">Lọc mảng</button>
</body>
<script>
    let numbers = [15, 20, 12, 18, 25, 30, 10];

    function filterArray() {
        const filteredNumbers = numbers.filter(function(number) {
            return number >= 18;
        });
        console.log("Các số lớn hơn hoặc bằng 18: " + filteredNumbers);
        alert("Các số lớn hơn hoặc bằng 18: " + filteredNumbers);
    }
</script>
</html>

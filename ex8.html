<body>
    <h1>Danh sách công việc</h1>

    <ul id="task-list">
        <li>Việc 1 <button class="delete-btn">Xóa</button></li>
        <li>Việc 2 <button class="delete-btn">Xóa</button></li>
        <li>Việc 3 <button class="delete-btn">Xóa</button></li>
        <li>Việc 4 <button class="delete-btn">Xóa</button></li>
        <li>Việc 5 <button class="delete-btn">Xóa</button></li>
    </ul>

    <script>
        let deleteBtns = document.querySelectorAll(".delete-btn");

        for (let i = 0; i < deleteBtns.length; i++) {
            deleteBtns[i].addEventListener("click", function (event) {
                let liElement = event.target.parentElement;
                liElement.remove();
                console.log("Đã xóa:", liElement);
            });
        }
    </script>
</body>

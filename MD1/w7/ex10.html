<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 10</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="flex min-h-screen">
        <aside
            class="w-64 bg-gray-900 text-white fixed inset-y-0 left-0 z-10 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out">
            <div class="p-5 border-b border-gray-800">
                <h2 class="text-xl font-bold">TechGadget</h2>
                <p class="text-gray-400 text-sm">Admin Panel</p>
            </div>
            <nav class="p-4">
                <ul class="space-y-2">
                    <li><a href="#" class="block px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700">📊 Tổng quan hệ
                            thống</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-gray-700">📦 Quản lý đơn hàng</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-gray-700">🛍️ Quản lý sản phẩm</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-gray-700">👥 Khách hàng truy cập</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-gray-700">📈 Tỉ lệ chuyển đổi</a></li>
                </ul>
            </nav>
        </aside>

        <div class="flex-1 md:ml-0">
            <header class="bg-white shadow-sm p-4 flex items-center justify-between">
                <button id="menuToggle" class="md:hidden text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <h1 class="text-xl font-semibold text-gray-800">Bảng Điều Khiển</h1>
                <div class="w-8 h-8 bg-gray-300 rounded-full"></div>
            </header>

            <main class="p-5">
                <div class="mb-6">
                    <div class="relative">
                        <input type="text" placeholder="Tìm kiếm đơn hàng, sản phẩm..."
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                        <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-blue-500">
                        <p class="text-gray-500 text-sm">Doanh thu</p>
                        <p class="text-2xl font-bold text-gray-800">125.000.000đ</p>
                        <p class="text-green-500 text-sm mt-2">↑ 12.5%</p>
                    </div>

                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-green-500">
                        <p class="text-gray-500 text-sm">Đơn hàng</p>
                        <p class="text-2xl font-bold text-gray-800">342</p>
                        <p class="text-green-500 text-sm mt-2">↑ 8.2%</p>
                    </div>

                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-yellow-500">
                        <p class="text-gray-500 text-sm">Khách hàng</p>
                        <p class="text-2xl font-bold text-gray-800">1.204</p>
                        <p class="text-green-500 text-sm mt-2">↑ 23.1%</p>
                    </div>

                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-purple-500">
                        <p class="text-gray-500 text-sm">Tỉ lệ chuyển đổi</p>
                        <p class="text-2xl font-bold text-gray-800">4.5%</p>
                        <p class="text-red-500 text-sm mt-2">↓ 1.2%</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('aside');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth < 768 && !sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                if (!sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                }
            }
        });
    </script>
</body>

</html>

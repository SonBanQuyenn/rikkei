<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 9 </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #8b1e1e;
            --bs-primary-rgb: 139, 30, 30;
            --bs-dark: #000000;
            --bs-dark-rgb: 0, 0, 0;
        }

        .btn-primary {
            --bs-btn-bg: #8b1e1e;
            --bs-btn-border-color: #8b1e1e;
            --bs-btn-hover-bg: #6b1717;
            --bs-btn-hover-border-color: #6b1717;
            --bs-btn-active-bg: #5a1212;
        }

        .btn-dark {
            --bs-btn-bg: #000000;
            --bs-btn-border-color: #000000;
            --bs-btn-hover-bg: #1a1a1a;
            --bs-btn-hover-border-color: #1a1a1a;
        }

        body {
            background: #f0f2f5;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-5">
                            <img src="https://picsum.photos/id/91/500/400" alt="Tech Talk AI Event"
                                class="img-fluid h-100 w-100" style="object-fit: cover; min-height: 280px;">
                        </div>
                        <div class="col-md-7">
                            <div class="card-body p-4 p-md-5">
                                <div class="mb-3">
                                    <span class="badge bg-danger bg-opacity-10 text-danger px-3 py-2 rounded-pill">🎤
                                        Rikkei Academy</span>
                                </div>

                                <h1 class="display-6 fw-bold text-dark mb-3">Tech Talk: Tương Lai Lập Trình AI</h1>

                                <p class="text-secondary mb-4" style="line-height: 1.6;">Tham gia cùng Rikkei Academy để
                                    khám phá những xu hướng công nghệ AI mới nhất và cách ứng dụng vào phát triển phần
                                    mềm trong từng lần.</p>

                                <div class="mb-4 pb-2">
                                    <div class="d-flex align-items-center mb-2">
                                        <span class="me-2">🕘</span>
                                        <span><strong>Thời gian:</strong> 09:00 - 12:00, 25/11/2026</span>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <span class="me-2">📍</span>
                                        <span><strong>Địa điểm:</strong> Cơ sở Rikkei Academy HN</span>
                                    </div>
                                </div>

                                <div class="d-flex gap-3">
                                    <button class="btn btn-primary px-4 py-2 rounded-pill fw-semibold">Đăng Ký
                                        Ngay</button>
                                    <button class="btn btn-dark px-4 py-2 rounded-pill fw-semibold">Xem Chi
                                        Tiết</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light pt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-lg-5">
                        <h1 class="h3 mb-4 fw-bold text-center text-primary">Thêm Sách Mới</h1>

                        <form>
                            <div class="mb-4">
                                <label for="bookTitle" class="form-label fw-semibold">Tên sách</label>
                                <input type="text" class="form-control form-control-lg rounded-3" id="bookTitle"
                                    placeholder="Nhập tên sách...">
                            </div>

                            <div class="mb-4">
                                <label for="author" class="form-label fw-semibold">Tác giả</label>
                                <input type="text" class="form-control form-control-lg rounded-3" id="author"
                                    placeholder="Nhập tên tác giả...">
                            </div>

                            <div class="mb-4">
                                <label for="category" class="form-label fw-semibold">Thể loại</label>
                                <select class="form-select form-select-lg rounded-3" id="category">
                                    <option selected>Chọn thể loại...</option>
                                    <option value="1">Tiểu thuyết</option>
                                    <option value="2">Kinh tế</option>
                                    <option value="3">Khoa học</option>
                                    <option value="4">Thiếu nhi</option>
                                    <option value="5">Kỹ năng sống</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg rounded-3 py-2 fw-semibold">Thêm
                                    sách</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
